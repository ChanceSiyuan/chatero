<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>QLab QMD Editor</title>
	<style>
		:root {
			color-scheme: light;
			background: #fff;
		}
		html, body, #qmd-monaco, #qmd-normal, #qmd-diff {
			width: 100%;
			height: 100%;
			margin: 0;
			overflow: hidden;
		}
		body {
			background: #fff;
		}
		#qmd-monaco {
			position: relative;
		}
		#qmd-normal, #qmd-diff {
			position: absolute;
			inset: 0;
		}
		#qmd-diff {
			display: none;
		}
		.qmd-block-theorem,
		.qmd-block-lemma,
		.qmd-block-definition,
		.qmd-block-proof {
			background: rgba(66, 133, 244, 0.055);
			border-left: 2px solid rgba(105, 155, 255, 0.65);
		}
		.qmd-block-math {
			background: rgba(166, 106, 255, 0.07);
		}
		.qmd-block-frontmatter {
			background: rgba(60, 120, 220, 0.035);
		}
	</style>
</head>
<body>
	<div id="qmd-monaco">
		<div id="qmd-normal"></div>
		<div id="qmd-diff"></div>
	</div>
	<script src="resource://zotero/vs/loader.js"></script>
	<script>
		let qmdMonaco;
		let qmdEditor;
		let qmdDiffEditor;
		let qmdLoadPromise;
		let qmdNormalModel;
		let qmdCompletionProvider;
		let qmdDecorations = [];
		let qmdCompletions = [];
		let qmdSuppressChanges = false;
		let qmdMode = 'normal';
		let qmdListeners = new Set();
		let qmdDisposables = [];
		let qmdDisposed = false;
		let qmdLoadResolve = null;
		let qmdWorkerObjectURL = '';
		let qmdResizeListener = null;

		function emitQmdMonaco(event) {
			for (let listener of qmdListeners) {
				try {
					listener(event);
				}
				catch (error) {
					console.error(error);
				}
			}
		}

		function subscribeQmdMonaco(listener) {
			qmdListeners.add(listener);
			return () => qmdListeners.delete(listener);
		}

		function qmdWorkerURL() {
			return URL.createObjectURL(new Blob([`
				self.MonacoEnvironment = { baseUrl: 'resource://zotero/' };
				importScripts('resource://zotero/vs/base/worker/workerMain.js');
			`], { type: 'text/javascript' }));
		}

		function releaseQmdWorkerURL() {
			if (!qmdWorkerObjectURL) return;
			URL.revokeObjectURL(qmdWorkerObjectURL);
			qmdWorkerObjectURL = '';
		}

		function loadQmdMonaco() {
			if (qmdDisposed) return Promise.resolve({ disposed: true });
			if (qmdLoadPromise) return qmdLoadPromise;
			require.config({ paths: { vs: 'resource://zotero/vs' } });
			qmdWorkerObjectURL = qmdWorkerURL();
			window.MonacoEnvironment = { getWorkerUrl: () => qmdWorkerObjectURL };
			qmdLoadPromise = new Promise((resolve, reject) => {
				qmdLoadResolve = resolve;
				require(['vs/editor/editor.main'], () => {
					if (qmdDisposed) {
						releaseQmdWorkerURL();
						return;
					}
					qmdMonaco = monaco;
					qmdEditor = monaco.editor.create(document.getElementById('qmd-normal'), {
						language: 'markdown',
						theme: 'vs',
						automaticLayout: true,
						wordWrap: 'on',
						minimap: { enabled: false },
						scrollBeyondLastLine: false,
						padding: { top: 12, bottom: 28 },
					});
					qmdDisposables.push(qmdEditor.onDidChangeModelContent(() => {
						if (!qmdSuppressChanges && qmdMode === 'normal') {
							emitQmdMonaco({ type: 'change', text: qmdEditor.getValue() });
						}
					}));
					qmdDisposables.push(qmdEditor.onDidChangeCursorPosition(event => {
						let model = qmdEditor.getModel();
						emitQmdMonaco({
							type: 'cursor',
							lineNumber: event.position.lineNumber,
							column: event.position.column,
							offset: model ? model.getOffsetAt(event.position) : 0,
						});
					}));
					qmdEditor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, () => {
						emitQmdMonaco({ type: 'command', command: 'save' });
					});
					qmdEditor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyK, () => {
						let model = qmdEditor.getModel();
						let selection = qmdEditor.getSelection();
						emitQmdMonaco({
							type: 'command',
							command: 'ai',
							selection: model ? model.getValueInRange(selection) : '',
							start: model ? model.getOffsetAt(selection.getStartPosition()) : 0,
							end: model ? model.getOffsetAt(selection.getEndPosition()) : 0,
						});
					});
					qmdCompletionProvider = monaco.languages.registerCompletionItemProvider('markdown', {
						triggerCharacters: ['@', ':'],
						provideCompletionItems(model, position) {
							let word = model.getWordUntilPosition(position);
							let range = {
								startLineNumber: position.lineNumber,
								endLineNumber: position.lineNumber,
								startColumn: word.startColumn,
								endColumn: word.endColumn,
							};
							return {
								suggestions: qmdCompletions.map(item => ({
									label: item.label,
									detail: item.detail || '',
									insertText: item.insertText,
									insertTextRules: item.kind === 'snippet'
										? monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet
										: undefined,
									kind: item.kind === 'reference'
										? monaco.languages.CompletionItemKind.Reference
										: monaco.languages.CompletionItemKind.Snippet,
									range,
								})),
							};
						},
					});
					qmdResizeListener = () => {
						qmdEditor?.layout();
						qmdDiffEditor?.layout();
					};
					window.addEventListener('resize', qmdResizeListener);
					qmdLoadResolve = null;
					emitQmdMonaco({ type: 'ready' });
					resolve({ monaco, editor: qmdEditor });
				}, error => {
					qmdLoadResolve = null;
					releaseQmdWorkerURL();
					reject(error || new Error('Unable to load QMD Monaco'));
				});
			});
			return qmdLoadPromise;
		}

		function modelFor(uri, text) {
			let modelURI = qmdMonaco.Uri.parse(uri);
			let model = qmdMonaco.editor.getModel(modelURI);
			if (!model) {
				model = qmdMonaco.editor.createModel(text, 'markdown', modelURI);
			}
			else if (model.getValue() !== text) {
				model.setValue(text);
			}
			let eol = text.includes('\r\n')
				? qmdMonaco.editor.EndOfLineSequence.CRLF
				: qmdMonaco.editor.EndOfLineSequence.LF;
			model.setEOL(eol);
			return model;
		}

		async function setQmdModel(payload = {}) {
			await loadQmdMonaco();
			if (qmdDisposed) return false;
			qmdMode = 'normal';
			qmdSuppressChanges = true;
			try {
				qmdDiffEditor?.setModel(null);
				qmdDiffEditor?.dispose();
				qmdDiffEditor = null;
				document.getElementById('qmd-diff').style.display = 'none';
				document.getElementById('qmd-normal').style.display = '';
				qmdNormalModel = modelFor(payload.uri, String(payload.text || ''));
				qmdEditor.updateOptions(payload.options || {});
				qmdEditor.setModel(qmdNormalModel);
				qmdCompletions = Array.isArray(payload.completions) ? payload.completions : [];
				setQmdDecorations(payload.decorations || []);
				setQmdDiagnostics(payload.diagnostics || []);
			}
			finally {
				qmdSuppressChanges = false;
			}
			qmdEditor.focus();
			return true;
		}

		async function setQmdDiff(payload = {}) {
			await loadQmdMonaco();
			if (qmdDisposed) return false;
			qmdMode = 'diff';
			document.getElementById('qmd-normal').style.display = 'none';
			document.getElementById('qmd-diff').style.display = '';
			if (!qmdDiffEditor) {
				qmdDiffEditor = qmdMonaco.editor.createDiffEditor(document.getElementById('qmd-diff'), {
					...payload.options,
					automaticLayout: true,
					originalEditable: false,
					readOnly: true,
					renderSideBySide: true,
				});
			}
			qmdDiffEditor.setModel({
				original: modelFor(payload.original.uri, String(payload.original.text || '')),
				modified: modelFor(payload.modified.uri, String(payload.modified.text || '')),
			});
			return true;
		}

		function offsetRange(model, item) {
			let start = model.getPositionAt(Math.max(0, Number(item.start) || 0));
			let end = model.getPositionAt(Math.max(Number(item.start) || 0, Number(item.end) || 0));
			return new qmdMonaco.Range(start.lineNumber, start.column, end.lineNumber, end.column);
		}

		function setQmdDecorations(decorations = []) {
			if (!qmdEditor || !qmdNormalModel) return;
			qmdDecorations = qmdEditor.deltaDecorations(qmdDecorations, decorations.map(item => ({
				range: offsetRange(qmdNormalModel, item),
				options: { isWholeLine: item.kind !== 'math', className: `qmd-block-${item.kind}` },
			})));
		}

		async function setQmdDiagnostics(diagnostics = []) {
			await loadQmdMonaco();
			if (qmdDisposed) return false;
			if (!qmdNormalModel) return;
			qmdMonaco.editor.setModelMarkers(qmdNormalModel, 'qlab-qmd', diagnostics.map(item => {
				let range = offsetRange(qmdNormalModel, item);
				return {
					...range,
					severity: item.severity === 'warning'
						? qmdMonaco.MarkerSeverity.Warning
						: qmdMonaco.MarkerSeverity.Error,
					message: item.message || 'Invalid QMD source',
					code: item.code,
				};
			}));
			return true;
		}

		async function revealQmdRange(range = {}) {
			await loadQmdMonaco();
			if (qmdDisposed) return false;
			if (!qmdNormalModel) return;
			let monacoRange = range.startLineNumber
				? range
				: offsetRange(qmdNormalModel, range);
			qmdEditor.revealRangeInCenter(monacoRange);
			qmdEditor.setSelection(monacoRange);
			qmdEditor.focus();
			return true;
		}

		function snapshotQmdView() {
			return {
				mode: qmdMode,
				uri: qmdNormalModel ? qmdNormalModel.uri.toString() : '',
				text: qmdMode === 'normal' && qmdEditor ? qmdEditor.getValue() : '',
				position: qmdMode === 'normal' && qmdEditor ? qmdEditor.getPosition() : null,
			};
		}

		function disposeQmdMonaco() {
			if (qmdDisposed) return;
			qmdDisposed = true;
			if (qmdLoadResolve) {
				qmdLoadResolve({ disposed: true });
				qmdLoadResolve = null;
			}
			if (qmdResizeListener) {
				window.removeEventListener('resize', qmdResizeListener);
				qmdResizeListener = null;
			}
			releaseQmdWorkerURL();
			for (let disposable of qmdDisposables.splice(0)) disposable.dispose();
			qmdCompletionProvider?.dispose();
			qmdDiffEditor?.dispose();
			qmdEditor?.dispose();
			for (let model of qmdMonaco?.editor.getModels() || []) {
				if (model.uri.toString().startsWith('inmemory://qlab/')) model.dispose();
			}
			qmdListeners.clear();
			qmdCompletionProvider = null;
			qmdDiffEditor = null;
			qmdEditor = null;
			qmdNormalModel = null;
		}
	</script>
</body>
</html>
